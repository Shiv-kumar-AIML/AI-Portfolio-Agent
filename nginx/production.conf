# Edge nginx for docker-compose.production.yml.
#
#   /            -> frontend (static React build)
#   /api/*       -> api gateway (Express)
#   /internal/*  -> 404, ALWAYS. The api's /internal routes, the whole ai-service and the browser
#                   service are reachable only on the Docker network; never add a route to them here.
#
# TLS: the simplest setup is a host-level Caddy/Cloudflare in front of port 80. To terminate TLS
# here instead, mount your certificates and uncomment the 443 block at the bottom.

# Second line of defence behind the api's own per-IP limits: chat costs LLM tokens.
limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 256k;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /internal {
        return 404;
    }

    # Server-Sent Events: no buffering, long read timeout, so tokens reach the browser as they stream.
    location = /api/chat {
        limit_req zone=chat burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api:5010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # The mini-OS live browser: a long-lived WebSocket (frames down, input up).
    location = /api/browser {
        proxy_pass http://api:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    location /api/ {
        proxy_pass http://api:5010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

