# Runs every service's tests on main. Add a deploy job here with
# `needs: [ai-service, api, browser, frontend]` so nothing deploys unless all of them pass.
name: ci

on:
  push:
    branches: [main]

jobs:
  ai-service:
    uses: ./.github/workflows/ai-service-tests.yml
  api:
    uses: ./.github/workflows/api-tests.yml
  browser:
    uses: ./.github/workflows/browser-tests.yml
  frontend:
    uses: ./.github/workflows/frontend-tests.yml
