name: browser tests

on:
  workflow_call:
  pull_request:
    paths: ["browser/**", ".github/workflows/browser-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # the unit tests don't launch Chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
