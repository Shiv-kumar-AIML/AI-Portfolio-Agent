[project]
name = "portfolio-ai-service"
version = "0.1.0"
description = "Portfolio AI microservice: tool-calling agent + hybrid RAG over the owner's content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.40.0",  # Groq exposes an OpenAI-compatible API, so the same client works for both
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "fastembed>=0.4.0",  # ONNX embeddings on CPU — no torch, no embedding API key
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not llm_eval'"
markers = [
    "llm_eval: real Groq-call regression tests (need GROQ_API_KEY, non-deterministic — run explicitly with `-m llm_eval`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: `ruff format` already wraps code at 100; the only long lines left are prose strings (prompt, tool docs).
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
