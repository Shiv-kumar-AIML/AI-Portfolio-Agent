<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PLACEHOLDER: update title/description/og tags with your name -->
    <title>AI / ML Engineer — Portfolio</title>
    <meta name="description" content="Chat with my AI: an agent with tools and hybrid RAG that answers questions about my projects, skills and experience." />
    <meta property="og:title" content="AI / ML Engineer — Portfolio" />
    <meta property="og:description" content="Ask my AI agent anything about my work." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Set the theme class before first paint (no light flash in dark mode). Mirrors
      // src/components/theme.tsx — same storage key.
      (function () {
        var theme = 'light'
        try { theme = JSON.parse(localStorage.getItem('portfolio.theme')) || 'light' } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
